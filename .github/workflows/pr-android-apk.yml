name: Android PR APK

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: android-pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve and verify PR head SHA
        id: head
        run: |
          node scripts/apk-provenance.mjs resolve --event "$GITHUB_EVENT_PATH"
          node scripts/apk-provenance.mjs check-checkout --event "$GITHUB_EVENT_PATH" --actual "$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN. Add an Expo access token so local EAS Build can download the existing managed Android signing credentials."
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      # Read-only. Without a remote versionCode, `eas build` (no autoIncrement) would
      # WRITE an initial remote version; refuse instead. See docs/ANDROID_PR_APK.md.
      - name: Check remote versionCode exists (read-only)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build:version:get --platform android --profile preview --non-interactive --json > "$RUNNER_TEMP/remote-version.json"
          node scripts/apk-provenance.mjs remote-version --file "$RUNNER_TEMP/remote-version.json"

      - name: Build signed installable preview APK locally
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          APK_FILE: ${{ steps.head.outputs.apk_file }}
        run: |
          mkdir -p artifacts
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$GITHUB_WORKSPACE/artifacts/$APK_FILE"

      - name: Inspect real APK and write provenance
        env:
          APK_FILE: ${{ steps.head.outputs.apk_file }}
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.EXPECTED_ANDROID_CERT_SHA256 }}
        run: |
          BT="$(ls -d "${ANDROID_HOME:?}"/build-tools/*/ | sort -V | tail -n 1)"
          APK="$GITHUB_WORKSPACE/artifacts/$APK_FILE"
          "${BT}aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          # Public certificate info only (DN and digests are embedded in every distributed APK).
          # Capture the exit code so the output is always logged, then fail the step as before.
          APKSIGNER_RC=0
          "${BT}apksigner" verify -v --print-certs "$APK" > "$RUNNER_TEMP/certs.txt" 2> "$RUNNER_TEMP/certs.err" || APKSIGNER_RC=$?
          echo "::group::aapt2 package line (public badging info, non-secret)"
          grep '^package:' "$RUNNER_TEMP/badging.txt" || true
          echo "::endgroup::"
          echo "::group::apksigner output (public certificate info, non-secret)"
          echo "--- certs.txt ---"
          cat "$RUNNER_TEMP/certs.txt"
          echo "--- certs.err ---"
          cat "$RUNNER_TEMP/certs.err"
          echo "::endgroup::"
          if [ "$APKSIGNER_RC" -ne 0 ]; then
            echo "::error::apksigner verify exited $APKSIGNER_RC"
            exit "$APKSIGNER_RC"
          fi
          # Fallback only when apksigner printed no signer digest line (ignoring Source Stamp lines).
          DIGEST_LINES="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | grep -vi 'source stamp' || true)"
          if [ -z "$DIGEST_LINES" ]; then
            keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/keytool.txt" 2>&1 || true
            echo "::group::keytool output (public certificate info, non-secret; fallback)"
            cat "$RUNNER_TEMP/keytool.txt"
            echo "::endgroup::"
          fi
          node scripts/apk-provenance.mjs verify \
            --event "$GITHUB_EVENT_PATH" \
            --badging "$RUNNER_TEMP/badging.txt" \
            --certs "$RUNNER_TEMP/certs.txt" \
            --keytool "$RUNNER_TEMP/keytool.txt" \
            --checked-out-sha "$(git rev-parse HEAD)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out-dir "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK and provenance
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.head.outputs.artifact_name }}
          path: |
            artifacts/${{ steps.head.outputs.apk_file }}
            artifacts/apk-provenance.json
          if-no-files-found: error
          retention-days: 14

      # Only after the new artifact is safely uploaded: prune older builds of this PR.
      - name: Delete older APK artifacts for this PR
        uses: actions/github-script@v7
        env:
          NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { artifactPrefix, selectArtifactsToDelete } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/apk-provenance.mjs`));
            const keepId = Number(process.env.NEW_ARTIFACT_ID);
            if (!Number.isInteger(keepId) || keepId <= 0) {
              core.setFailed('Missing new artifact id; not deleting anything.');
              return;
            }
            const prNumber = context.payload.pull_request.number;
            // The API name filter is exact-match, so list everything and filter by prefix.
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of selectArtifactsToDelete(all, prNumber, keepId)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }

      - name: Comment candidate on PR (unless superseded)
        if: success()
        uses: actions/github-script@v7
        env:
          BUILT_SHA: ${{ steps.head.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { isSuperseded } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/apk-provenance.mjs`));
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (isSuperseded(process.env.BUILT_SHA, pr.head.sha)) {
              core.warning(`Built ${process.env.BUILT_SHA} but PR head is now ${pr.head.sha}; superseded, not posting a candidate comment.`);
              return;
            }
            const body = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/artifacts/comment.md`, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
