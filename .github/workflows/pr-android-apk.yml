name: Android PR APK

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: android-pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN. Add an Expo access token so local EAS Build can download the existing managed Android signing credentials."
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      - name: Build signed installable preview APK locally
        env:
          CI: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p artifacts
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "${{ github.workspace }}/artifacts/red-light-rng-pr-${{ github.event.pull_request.number }}-android-preview.apk"

      - name: Delete previous APK artifacts for this PR
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `red-light-rng-pr-${context.issue.number}-android-preview`;
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });

            for (const artifact of data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted old artifact ${artifact.name} (${artifact.id})`);
            }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: red-light-rng-pr-${{ github.event.pull_request.number }}-android-preview
          path: artifacts/red-light-rng-pr-${{ github.event.pull_request.number }}-android-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Comment APK location on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '📱 Signed Android APK ready for physical-device testing.',
              '',
              `Download the **red-light-rng-pr-${context.issue.number}-android-preview** artifact from this workflow run:`,
              runUrl,
              '',
              'Only the latest APK artifact for this PR is retained; older APK artifacts for the same PR are deleted before upload.',
              '',
              'This APK is built locally on GitHub Actions but uses the existing EAS-managed Android signing credentials, so it can update the previously installed preview build without wiping app data.',
              '',
              `Built from commit \`${context.sha}\`.`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
